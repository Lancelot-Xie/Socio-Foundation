[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-simulation-code"
version = "0.1.0"
description = "Frozen multi-teacher on-policy distillation for Simulation task and dimension experts"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.9", "transformers>=4.51,<4.58", "peft>=0.15,<0.19",
  "accelerate>=1.6,<1.13", "PyYAML>=6", "safetensors>=0.4", "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]
parquet = ["pyarrow>=19"]
objective = ["tiktoken>=0.9,<0.13", "regex>=2024.11.6"]
deepspeed = ["deepspeed>=0.16"]

[project.scripts]
simulation-train = "opd.cli:main"

[tool.setuptools.packages.find]
include = ["opd*", "fusion_ablation*", "crossdistill*", "direct_task_equal_opd_ablation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
